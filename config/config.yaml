# Paths are relative to the repository root, from where the scripts are run
# (e.g. ./start.sh, python3 ./src/SynGenLLM.py).
syngen:
  # Picked by their index (from 0). Settings: test (the development set
  # instead of the evaluation set), few_shot, definition, comment, structure
  # (parents and children) and stages (the sources, in this order); a missing
  # setting is off, missing stages are all three.
  experiments:
    - {test: True, few_shot: True, definition: True, comment: True, structure: True}
  # Concepts with exact synonyms are drawn at random with the seed until
  # their exact synonyms number at least synonym_count; runs with "test"
  # generate for them, the others for all other concepts. few_shot_count of
  # them are the few-shot examples, scored in no run.
  development_set:
    synonym_count: 500
    seed: 2898231092
    few_shot_count: 3
  data_folder: "./data"
  # The gold standard: exact synonyms, without those equal to their label,
  # those HPO also lists with another class, and those of these types.
  gold:
    exclude_types:
      - "obsolete"
  # SynGenLLM.py: every concept is prompted `rounds` times (seed, seed + 1,
  # ...); a synonym counts how many rounds generated it.
  llm:
    rounds: 50
    max_synonyms: 25
  # SynGenPubMed.py: the label and all LLM synonyms of a concept are searched
  # in the titles and abstracts published up to max_date.
  pubmed:
    max_date: "2026/06/30"
    articles_per_query: 20
    field: "tiab"
    # With an API key (read from this environment variable) NCBI allows 10
    # requests per second, without 3.
    api_key_variable: "NCBI_API_KEY"
    requests_per_second: 3
    retries: 5
    email: "peter.pallaoro@tum.de"
    cache_file: "./data/cache/pubmed/pubmed.sqlite"
    ner_model: "d4data/biomedical-ner-all"
    ner_batch_size: 64
    # The entity groups of the NER model that are candidates, e.g.
    # "Sign_symptom" or "Disease_disorder"; all if empty.
    entity_groups: []
    # "seed": only sentences mentioning the searched term; "all": every one.
    sentences: "seed"
    min_length: 3
    # Per concept: the candidates at least this similar to the label, at most
    # max_candidates of them.
    min_similarity: 0.85
    max_candidates: 15
  # SynGenConceptNet.py: the words of the label and of the synonyms of these
  # sources are replaced by their ConceptNet neighbours.
  conceptnet:
    # The assertions dump, and the database SynGenConceptNetDB.py builds from
    # it (with the relations and languages below).
    dump: "./data/input/conceptnet/conceptnet-assertions-5.7.0.csv.gz"
    database: "./data/input/conceptnet/conceptnet.sqlite"
    relations:
      - "Synonym"
      - "FormOf"
    languages:
      - "en"
    hops: 1
    max_span: 3
    blacklisted_senses: ["animal", "plant", "food", "person", "group", "botany", "music", "military", "heraldry", "geology", "grammar", "law"]
    seed_sources:
      - "label"
      - "llm"
      - "pubmed"
    max_substitutions: 2
    max_terms_per_seed: 200
    # The LLM keeps the neighbours that can replace the word in the label.
    filter: True
    filter_temperature: 0.01
    filter_chunk: 20
    min_similarity: 0.85
    max_candidates: 15
  # Name of a model of embedder.model_id in the column names; by default its
  # ID without the organisation.
  embedding_model_names: {}
  evaluation:
    # A generated synonym matches a gold synonym ("embedding") at this cosine
    # similarity; the curve spans the thresholds from lower to upper.
    embedding_match: 1.0
    threshold_lower: 0.5
    threshold_upper: 1.0
    threshold_step: 0.01
    bootstrap_samples: 1000
    bootstrap_seed: 0
adapter:
  hpo:
    input_folder: "./data/input/hpo/"
    input_files:
      - "hp.owl"
    # The transformed HPO, which the preparation run writes; the development
    # and evaluation set are named after it in the same folder
    # (hpo.development.csv, hpo.evaluation.csv).
    output_folder: "./data/output/transformed/"
    output_file: "hpo.csv"
    skip_if_present: False
    prefix: ""
logger:
  folder: "./data/logs/"
  # One log file per run, named after its start to the microsecond, so that
  # runs started at the same time get their own file.
  file_name: "syngen_{start:%Y%m%d_%H%M%S_%f}.log"
  header_char: "="
  header_length: 90
  log_runtime: True
  format: "%Y-%m-%d %H:%M:%S"
  encoding: "utf-8"
llm:
  # Generating one after the other; a model ID after the experiment index on
  # the command line generates with only that model.
  model_id:
    - "Qwen/Qwen2.5-72B-Instruct-GPTQ-Int4"
  # The Hugging Face commit per model ID (see the model package), so that
  # every run loads the same model version (as of 2026-11-09); the commits of
  # a run are recorded in data/logs/run_metadata.json.
  revision:
    "Qwen/Qwen2.5-72B-Instruct-GPTQ-Int4": "da6e9d45661b91e02782f4ae2c6bb39c4a5b4821"
  device: "cuda"
  expert_parallel_models:
    - "Qwen3-30B"
  # The seed of the first round; round r uses seed + r - 1.
  seed: 2898231092
  # High, so that the rounds generate different synonyms.
  temperature: 0.95
  top_p: 0.95
  max_model_len: 8192
  max_num_batched_tokens: 16384
  enforce_eager: false
  gpu_memory_utilization: 0.9
  dtype: "auto"
  # The GPTQ weights are recognised from the model's configuration.
  quantization: null
  enable_prefix_caching: true
  enable_thinking: null
  reasoning_start_tag: "<think>"
  reasoning_end_tag: "</think>"
  max_tokens: 8192
  chunk_size: 500
  # Used by their index: 0 generates the synonyms, 1 is the ConceptNet filter.
  prompt_folder: "./prompts/"
  prompt_files:
    - "generation.md"
    - "conceptnet_filter.md"
  # The answer store (checkpoint) and the prompt log; the model package adds
  # the model name and the experiment and round to their names.
  prompt_tmp_folder: "./data/tmp/"
  prompt_tmp_file: "syngen.json"
  prompt_log_folder: "./data/logs/"
  prompt_log_file: "prompts.log"
  metadata_folder: "./data/logs/"
  metadata_file: "run_metadata.json"
embedder:
  # Named in the column names by syngen.embedding_model_names, or by the ID
  # without the organisation.
  model_id:
    - "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
  # Pinned Hugging Face commit, so that the cache never serves vectors of
  # another model version.
  revision:
    "cambridgeltl/SapBERT-from-PubMedBERT-fulltext": "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
  # CLS pooling, as SapBERT was trained with, over at most 64 tokens.
  pooling: "cls"
  max_seq_length: 64
  normalization: False
  lowercase: "auto"
  device: "cpu"
  backend: "torch"
  batch_size: 128
  # One file per model: only new terms are encoded.
  cache_folder: "./data/cache/embeddings/"
  dimensionality_reduction: False
normalizer:
  model_name: "en_core_sci_sm"
  lower_case: True
  lemmatizing: True
  stemming: False
  stop_word_removal: True
  keep_stop_words: []
  extra_stop_words: []
